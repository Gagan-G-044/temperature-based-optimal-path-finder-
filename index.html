<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermal Route - AI Perishable Logistics</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="logo-container">
            <h1>THERMAL ROUTE</h1>
            <span class="subtitle">AI PERISHABLE LOGISTICS</span>
        </div>
    </header>

    <main class="app-container">
        <div id="control-panel" class="sidebar">
            <div class="panel-section">
                <h2>Route Configuration</h2>
                <div class="form-group">
                    <label for="produce-type">Produce Type</label>
                    <select id="produce-type" class="custom-select">
                        <option value="tomato">Tomato</option>
                        <option value="leafy_greens">Leafy Greens</option>
                        <option value="mango">Mango</option>
                        <option value="potato_onion">Potato / Onion</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cargo-weight">Cargo Weight (kg)</label>
                    <input type="number" id="cargo-weight" class="custom-input" placeholder="e.g. 500" min="1">
                </div>
                <button id="calculate-route-btn" class="primary-btn">
                    <span class="btn-text">Calculate Optimal Route</span>
                    <span class="btn-icon">→</span>
                </button>
            </div>
            
            <div class="panel-section">
                <h2>Logistics Summary</h2>
                <div class="summary-stats">
                    <div class="stat-box">
                        <span class="stat-label">Total Distance</span>
                        <span class="stat-value" id="stat-distance">-- km</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Est. Decay Risk</span>
                        <span class="stat-value" id="stat-decay">-- %</span>
                    </div>
                </div>
                <div id="telemetry-status" class="telemetry-badge online">Telemetry: Ready</div>
            </div>
        </div>

        <div id="map-container" class="map-area">
            <div id="map"></div>
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/config.js"></script>
    <script src="js/routing.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
